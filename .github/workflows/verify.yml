name: verify

on:
  pull_request:
  push:
    branches: [main]

# A branch that gets three pushes in a minute ran three full jobs, and the two
# that no longer describe anything were still occupying runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Without this the job's token carries whatever the repository default grants.
# Nothing here writes anything.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Date-arithmetic tests (D-day badges) assume the deployment timezone.
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run verification
        run: bash scripts/verify.sh
